name: Build and Deploy Eleventy to O2Switch with ftp

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Eleventy
      run: npm run build

    - name: Cache Playwright browsers
      uses: actions/cache@v3
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Validate HTML
      run: npm run lint:html

    # Test the build about to be deployed, not the site currently in production
    - name: Serve the build locally
      run: |
        npx @11ty/eleventy --serve --port 8080 > /tmp/serve.log 2>&1 &
        for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/fr/accueil && exit 0; sleep 1; done
        cat /tmp/serve.log; exit 1

    - name: Run Playwright tests
      run: npx playwright test --reporter=list
      env:
        BASE_URL: http://localhost:8080

    # The old /fr/projet/brain page was a file; it is now a folder of the
    # same name, which the FTP upload cannot create while the file exists
    - name: Remove files replaced by folders
      # -k: o2switch serves a shared certificate that does not match the FTP
      # hostname (the deploy action accepts it too). Exit 21 = file already gone.
      run: |
        rc=0
        curl -sSk --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" \
          -Q "DELE portfolio/fr/projet/brain" -o /dev/null || rc=$?
        [ "$rc" -eq 0 ] || [ "$rc" -eq 21 ] || exit "$rc"
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        local-dir: ./_site/
        server-dir: portfolio/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**

    - name: Smoke test production
      run: |
        for path in /fr/accueil /en/home /fr/projets/; do
          curl -sf -o /dev/null "https://lionelpinheiroduarte.com$path" || { echo "$path is down"; exit 1; }
        done
